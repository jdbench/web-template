name: web-template

services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ALLOWED_PATHS: /var/lib/docker/volumes/web-template-hot-reload-code/_data

  dev-builder:
    build:
      context: .
      target: development
    volumes:
      - .:/workspace:ro
      - hot-reload-code:/hot-reload
    environment:
      SOURCE_ROOT: /workspace
      OUTPUT_ROOT: /hot-reload
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /hot-reload/handlers/index.mjs && test -f /hot-reload/frontend/dist/app.min.js && test -f /hot-reload/frontend/dist/app.min.css",
        ]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s

  bootstrap:
    image: amazon/aws-cli:latest
    depends_on:
      floci:
        condition: service_healthy
      dev-builder:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        if ! aws --endpoint-url "$$FLOCI_ENDPOINT" dynamodb describe-table --table-name "$$AUTH_TABLE_NAME" >/dev/null 2>&1; then
          aws --endpoint-url "$$FLOCI_ENDPOINT" dynamodb create-table \
            --table-name "$$AUTH_TABLE_NAME" \
            --attribute-definitions AttributeName=pk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST >/dev/null
          aws --endpoint-url "$$FLOCI_ENDPOINT" dynamodb update-time-to-live \
            --table-name "$$AUTH_TABLE_NAME" \
            --time-to-live-specification Enabled=true,AttributeName=expiresAt >/dev/null
        fi

        if aws --endpoint-url "$$FLOCI_ENDPOINT" lambda get-function --function-name "$$FUNCTION_NAME" >/dev/null 2>&1; then
          aws --endpoint-url "$$FLOCI_ENDPOINT" lambda delete-function --function-name "$$FUNCTION_NAME"
        fi

        aws --endpoint-url "$$FLOCI_ENDPOINT" lambda create-function \
          --function-name "$$FUNCTION_NAME" \
          --runtime nodejs24.x \
          --handler handlers/index.handler \
          --code "S3Bucket=hot-reload,S3Key=$$HOT_RELOAD_HOST_PATH" \
          --role "$$ROLE_ARN" \
          --timeout 15 \
          --environment '{"Variables":{"DYNAMODB_ENDPOINT":"http://floci:4566","AUTH_TABLE_NAME":"web-template-auth","ALLOWED_ORIGIN":"http://localhost:8080","SESSION_DURATION_SECONDS":"86400","ALLOW_INSECURE_AUTH":"true"}}' >/dev/null

        aws --endpoint-url "$$FLOCI_ENDPOINT" lambda create-function-url-config \
          --function-name "$$FUNCTION_NAME" \
          --auth-type NONE \
          --cors '{"AllowOrigins":["http://localhost:8080"],"AllowMethods":["GET","POST"],"AllowHeaders":["content-type"],"MaxAge":3600}' >/dev/null

        API_BASE_URL="$$(aws --endpoint-url "$$FLOCI_ENDPOINT" lambda get-function-url-config \
          --function-name "$$FUNCTION_NAME" \
          --query FunctionUrl \
          --output text)"
        API_BASE_URL="$${API_BASE_URL%/}"
        FUNCTION_HOST="$${API_BASE_URL#http://}"
        printf 'server {\n  listen 80;\n  server_name _;\n  client_max_body_size 1m;\n  location / {\n    proxy_http_version 1.1;\n    proxy_set_header Host %s;\n    proxy_set_header X-Forwarded-Proto $$scheme;\n    proxy_pass http://floci:4566;\n  }\n}\n' "$$FUNCTION_HOST" > /gateway/default.conf
        printf 'Hot-reload server: http://localhost:8080 -> %s\n' "$$API_BASE_URL"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      FLOCI_ENDPOINT: http://floci:4566
      FUNCTION_NAME: web-template-api
      AUTH_TABLE_NAME: web-template-auth
      HOT_RELOAD_HOST_PATH: /var/lib/docker/volumes/web-template-hot-reload-code/_data
      ROLE_ARN: arn:aws:iam::000000000000:role/lambda-role
    volumes:
      - gateway-config:/gateway

  frontend:
    image: nginx:1.29-alpine
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    volumes:
      - gateway-config:/etc/nginx/conf.d:ro

networks:
  default:
    name: web-template-network

volumes:
  floci-data:
  gateway-config:
  hot-reload-code:
    name: web-template-hot-reload-code
