<button class="header-sign-in" type="button" data-auth-open>Sign in</button>
<button
	class="profile-avatar"
	type="button"
	data-auth-open
	data-avatar-button
	aria-label="Open account"
	title="Open account"
	hidden
>
	<img data-avatar-image alt="" hidden />
	<span data-avatar-initial></span>
</button>
<input type="file" data-avatar-input accept="image/png,image/jpeg,image/webp" hidden />
